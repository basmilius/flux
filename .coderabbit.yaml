# CodeRabbit skips a pull request whose diff touches more than 100 files, and a
# sweep across the token layer reaches far more than that without being risky
# everywhere it lands. These filters point the review at the parts where a
# mistake is expensive and quiet: the token layer and the mixins built on it, the
# component styles that consume them, the statistics package (which resolves
# tokens in JavaScript, where a wrong value fails silently on a canvas), and the
# scripts that gate the whole thing in CI.
#
# What is left out is left out because it fails loudly or reviews cheaply
# elsewhere: docs are prose and runnable examples that the site build type checks
# and renders, and the flow, visuals and application packages carry mechanical
# token swaps rather than decisions.
#
# Widen this the moment a change lands somewhere these globs do not reach.
reviews:
    path_filters:
        - '!docs/**'
        - '!packages/application/**'
        - '!packages/flow/**'
        - '!packages/visuals/**'
