name: React package

on:
    push:
        branches: [main, develop, feat/react-components]
        paths:
            - 'packages/react/**'
            - 'packages/components/src/css/**'
            - 'bun.lock'
            - '.github/public-bunfig.toml'
            - '.github/workflows/react.yml'
permissions:
    contents: read

jobs:
    test:
        name: Build and test React
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

            - name: Use public package registry
              run: rm -f .npmrc

            - name: Install React dependencies
              run: bun install --filter @flux-ui/react --frozen-lockfile --ignore-scripts --config=.github/public-bunfig.toml

            - name: Test
              run: bun run --cwd packages/react test

            - name: Build
              run: bun run --cwd packages/react build

            - name: Build website showcase
              run: bun run --cwd packages/react build:showcase
