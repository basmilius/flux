name: Pull Request

on:
    pull_request:

concurrency:
    cancel-in-progress: true
    group: ${{ format('ci-{0}', github.event.pull_request.number) }}

permissions:
    contents: read

jobs:
    test:
        # Keep this name until the upstream required-check rule is updated.
        runs-on: ubuntu-latest
        name: 🚀 Build and preview
        steps:
            -   name: 👀 Checkout
                uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
                with:
                    persist-credentials: false

            -   name: 🍞 Setup Bun
                uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

            -   name: Use public package registry
                run: rm -f .npmrc

            -   name: 📦 Install React dependencies
                run: bun install --filter @flux-ui/react --frozen-lockfile --ignore-scripts --config=.github/public-bunfig.toml

            -   name: 🧪 Test React
                run: bun run --cwd packages/react test

            -   name: 🔨 Build React
                run: bun run --cwd packages/react build

            -   name: 🌐 Build React showcase
                run: bun run --cwd packages/react build:showcase
